# Publishes the personal, serverless build to GitHub Pages.
#
# Pages serves static files only, so this build has no backend — VITE_PERSONAL=1 makes the app
# boot straight into guest mode with no seeded demo data (see frontend/src/lib/demo.js). All
# workout data lives in the phone's browser storage; nothing is ever sent anywhere.
# The exercise stills and clips come from catalogue/media and are copied next to the app
# (exercise-media/): their licence allows a non-commercial fork to carry them unmodified but not
# to hotlink them from anywhere else (catalogue/media/NOTICE.md).
name: Deploy personal build to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'catalogue/**'
      - 'scripts/catalogue/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_PERSONAL: '1'
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
